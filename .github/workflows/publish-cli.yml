name: Publish CLI to PyPI

# Triggered by a tag push matching cli-v*
# Example: git tag cli-v0.1.0 && git push origin cli-v0.1.0
on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  # OIDC trusted-publisher migration is incomplete: the workflow
  # claim ``Isol8AI/goosetown/.github/workflows/publish-cli.yml``
  # is not registered on pypi.org, so OIDC publishes 403 with
  # ``invalid-publisher``. Falling back to the existing
  # ``PYPI_API_TOKEN`` secret (set 2026-05-04, used for 0.1.0–0.1.7).
  # Once a trusted publisher is registered on PyPI for this repo +
  # workflow, this can flip back to OIDC by re-adding ``id-token: write``
  # and removing ``password:`` below.

jobs:
  build-and-publish:
    name: Build wheel and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Build the wheel and sdist
        working-directory: apps/goosetown-cli
        run: uv build

      - name: Verify the wheel installs and --version works
        working-directory: apps/goosetown-cli
        run: |
          uv tool install dist/goosetown-*.whl
          goosetown --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goosetown-dist
          path: apps/goosetown-cli/dist/
          retention-days: 7

      - name: Publish to PyPI (API token fallback)
        # Falls back to ``PYPI_API_TOKEN`` until OIDC trusted publisher
        # is configured on pypi.org for this repo + workflow filename.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/goosetown-cli/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Set to true if you want to test against test.pypi.org first:
          # repository-url: https://test.pypi.org/legacy/
