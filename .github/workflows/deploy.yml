  dev-DeployVercelDev:
    name: DeployVercelDev
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - dev-goosetown-dev-auth-Deploy
      - dev-goosetown-dev-database-Deploy
      - dev-goosetown-dev-dns-Deploy
      - dev-goosetown-dev-network-Deploy
      - dev-goosetown-dev-api-Deploy
      - dev-goosetown-dev-storage-Deploy
      - dev-goosetown-dev-compute-Deploy
      - Build-Synth
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Settings
        run: vercel pull --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Frontend
        run: vercel build --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_DEV }}
          VITE_BACKEND_URL: https://api-dev.goosetown.isol8.co/api/v1
          VITE_WS_URL: wss://ws-dev.goosetown.isol8.co
      - name: Deploy to Vercel (Preview)
        id: vercel-deploy-dev
        run: DEPLOY_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN) && echo
          "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to dev.goosetown.isol8.co
        run: vercel alias ${{ steps.vercel-deploy-dev.outputs.DEPLOY_URL }}
          dev.goosetown.isol8.co --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  prod-ApproveProduction:
    name: ApproveProduction
    permissions:
      issues: write
    runs-on: ubuntu-latest
    needs:
      - Build-Synth
      - dev-goosetown-dev-auth-Deploy
      - dev-goosetown-dev-database-Deploy
      - dev-goosetown-dev-dns-Deploy
