  prod-DeployVercelProd:
    name: DeployVercelProd
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - prod-goosetown-prod-auth-Deploy
      - prod-goosetown-prod-database-Deploy
      - prod-goosetown-prod-dns-Deploy
      - prod-goosetown-prod-network-Deploy
      - prod-goosetown-prod-api-Deploy
      - prod-goosetown-prod-storage-Deploy
      - prod-goosetown-prod-compute-Deploy
      - Build-Synth
      - dev-goosetown-dev-auth-Deploy
      - dev-goosetown-dev-database-Deploy
      - dev-goosetown-dev-dns-Deploy
      - dev-goosetown-dev-network-Deploy
      - dev-goosetown-dev-api-Deploy
      - dev-goosetown-dev-storage-Deploy
      - dev-goosetown-dev-compute-Deploy
      - dev-DeployVercelDev
    env: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Frontend (Production)
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PROD }}
          VITE_BACKEND_URL: https://api.goosetown.isol8.co/api/v1
          VITE_WS_URL: wss://ws.goosetown.isol8.co
      - name: Deploy to Vercel (Production)
        id: vercel-deploy-prod
        run: DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN) && echo
          "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias to goosetown.isol8.co
        run: vercel alias ${{ steps.vercel-deploy-prod.outputs.DEPLOY_URL }}
          goosetown.isol8.co --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
