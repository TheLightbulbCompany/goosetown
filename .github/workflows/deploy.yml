      - dev-goosetown-dev-storage-Deploy
      - dev-goosetown-dev-compute-Deploy
      - dev-DeployVercelDev
    env: {}
    steps:
      - name: Approval Required
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: prez2307
          issue-title: Approve production deployment
