name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
        working-directory: apps/backend
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: apps/backend
      - name: Test
        run: uv run pytest tests/ -v
        working-directory: apps/backend
        env:
          ENVIRONMENT: test

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @goosetown/frontend run lint
      - name: Typecheck
        run: pnpm --filter @goosetown/frontend run typecheck
