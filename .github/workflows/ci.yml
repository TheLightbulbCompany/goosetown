name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
        working-directory: apps/backend
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: apps/backend
      - name: Bandit (high-severity SAST)
        # -lll = report only HIGH severity. Tighten to -ll later once baseline is clean.
        run: uv run bandit -r core routers main.py -lll
        working-directory: apps/backend
      - name: pip-audit (dependency CVE scan)
        run: uv run pip-audit --strict
        working-directory: apps/backend
      - name: Test
        run: uv run pytest tests/ -v
        working-directory: apps/backend
        env:
          ENVIRONMENT: test

  frontend-lint:
    name: Frontend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @goosetown/frontend run lint
      - name: Typecheck
        run: pnpm --filter @goosetown/frontend run typecheck
      - name: Test
        run: pnpm --filter @goosetown/frontend run test
      - name: pnpm audit (production deps, high severity)
        # --prod skips dev-only deps which often have known issues that don't
        # ship to users. --audit-level=high fails only on high/critical CVEs.
        # NB: ``pnpm audit`` doesn't support ``--recursive``, which ``--filter``
        # implicitly injects. Use working-directory + plain audit instead.
        working-directory: apps/frontend
        run: pnpm audit --prod --audit-level=high

  infra-test:
    name: Infra (CDK) Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/infra/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/infra
      - name: Test (Jest — CDK assertions)
        run: npm test -- --ci
        working-directory: apps/infra

  godot-test:
    name: Godot Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GdUnit4 tests
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: "4.6"
          paths: "res://tests"
          project_dir: "apps/godot"
          timeout: 10
          retries: 0
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: apps/godot/reports/
          retention-days: 7

  e2e-smoke:
    name: E2E Smoke (dev)
    runs-on: ubuntu-latest
    # Only run on main-bound PRs so feature-branch noise doesn't hit the
    # shared dev environment. Skips itself cleanly when dev is down.
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @goosetown/frontend exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm --filter @goosetown/frontend run test:e2e
        env:
          E2E_BASE_URL: https://dev.goosetown.isol8.co
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan (Semgrep + Gitleaks)
    runs-on: ubuntu-latest
    # PR-only: running on main-bound merges would block retroactively on baseline
    # findings. Once we triage the first run we can flip to fail-on-finding.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits in a PR.
          fetch-depth: 0
      - name: Semgrep (SAST — Python + TypeScript + OWASP Top 10)
        # Baseline triage: 0 findings from 551 rules across the codebase as
        # of 2026-04-27 (PR #218 run). Now failing the build on any new
        # finding so a regression doesn't quietly land.
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/typescript
            p/owasp-top-ten
      - name: TruffleHog (secret scanning)
        # gitleaks-action@v2 now requires a paid license for free OSS use; we
        # use TruffleHog instead — same coverage class, no license gate.
        # Failing build is correct here: secrets in a PR diff are never OK.
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified
