name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
        working-directory: apps/backend
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: apps/backend
      - name: Test
        run: uv run pytest tests/ -v
        working-directory: apps/backend
        env:
          ENVIRONMENT: test

  frontend-lint:
    name: Frontend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @goosetown/frontend run lint
      - name: Typecheck
        run: pnpm --filter @goosetown/frontend run typecheck
      - name: Test
        run: pnpm --filter @goosetown/frontend run test

  godot-test:
    name: Godot Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GdUnit4 tests
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: "4.6"
          paths: "res://tests"
          project_dir: "apps/godot"
          timeout: 10
          retries: 0
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: apps/godot/reports/
          retention-days: 7

  e2e-smoke:
    name: E2E Smoke (dev)
    runs-on: ubuntu-latest
    # Only run on main-bound PRs so feature-branch noise doesn't hit the
    # shared dev environment. Skips itself cleanly when dev is down.
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @goosetown/frontend exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm --filter @goosetown/frontend run test:e2e
        env:
          E2E_BASE_URL: https://dev.goosetown.isol8.co
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
