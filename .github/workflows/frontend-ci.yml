name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @goosetown/frontend run lint
      - name: Type check
        run: pnpm --filter @goosetown/frontend exec tsc --noEmit -p tsconfig.check.json
      - name: Build
        env:
          VITE_BACKEND_URL: https://api-dev.goosetown.isol8.co/api/v1
          VITE_WS_URL: wss://ws-dev.goosetown.isol8.co
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter @goosetown/frontend run build
