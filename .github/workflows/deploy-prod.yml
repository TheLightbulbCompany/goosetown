  prod-DeployVercelProd:
    name: DeployVercelProd
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - prod-goosetown-prod-auth-Deploy
      - prod-goosetown-prod-cluster-Deploy
      - prod-goosetown-prod-database-Deploy
      - prod-goosetown-prod-dns-Deploy
      - prod-goosetown-prod-eventing-Deploy
      - prod-goosetown-prod-observability-Deploy
      - prod-goosetown-prod-storage-Deploy
      - prod-goosetown-prod-api-Deploy
      - prod-goosetown-prod-network-Deploy
      - prod-goosetown-prod-gameserver-Deploy
      - prod-goosetown-prod-sprite-worker-Deploy
      - prod-goosetown-prod-worldgm-Deploy
      - prod-goosetown-prod-compute-Deploy
      - Build-Synth
    env: {}
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel Settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Frontend (Production)
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PROD }}
          VITE_BACKEND_URL: https://api.goosetown.thelightbulb.company/api/v1
          VITE_WS_URL: wss://ws.goosetown.thelightbulb.company
      - name: Deploy to Vercel (Production)
        id: vercel-deploy-prod
        run: DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN) && echo
          "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
