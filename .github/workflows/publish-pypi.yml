name: publish-pypi

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — do not upload to PyPI"
        type: boolean
        default: false

jobs:
  publish:
    name: Build and publish goosetown CLI to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/goosetown-cli

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#cli-v}"
          pyproject_version=$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::Tag version ($tag_version) does not match pyproject version ($pyproject_version)"
            echo "Bump pyproject.toml or retag."
            exit 1
          fi
          echo "Version match: $tag_version"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/goosetown-*.whl
          test -f dist/goosetown-*.tar.gz

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Smoke-test installed package (post-publish)
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/cli-v') }}
        run: |
          set -euo pipefail
          # Wait briefly for PyPI to index the new release.
          sleep 30
          tag_version="${GITHUB_REF_NAME#cli-v}"
          uv tool install "goosetown==${tag_version}"
          installed_version=$(uv tool run goosetown --version)
          echo "Installed: $installed_version"
          [ "$installed_version" = "goosetown/${tag_version}" ]
