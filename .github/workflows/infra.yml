name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'apps/infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to specific environment"
        required: false
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff-dev:
    name: CDK Diff (Dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/goosetown-dev-github-actions
          aws-region: us-east-1
      - name: CDK Diff
        id: diff
        run: npx cdk diff -c env=dev 2>&1 | tee diff-output.txt || true
      - name: Comment Diff on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('apps/infra/diff-output.txt', 'utf8');
            const body = `#### CDK Diff - Dev\n\n<details><summary>Show Diff</summary>\n\n\`\`\`\n${diff}\n\`\`\`\n\n</details>\n\n*Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  deploy-dev:
    name: Deploy to Dev
    needs: [diff-dev]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://api-dev.goosetown.isol8.co
    defaults:
      run:
        working-directory: apps/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/goosetown-dev-github-actions
          aws-region: us-east-1
      - name: CDK Deploy
        run: npx cdk deploy --all -c env=dev --require-approval never
