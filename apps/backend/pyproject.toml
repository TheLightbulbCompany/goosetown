[project]
name = "goosetown-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "boto3>=1.35",
    # 2.15.0 clears the 2.13.0 pyjwt advisories (PYSEC-2026-175/177/178/179 and later).
    "pyjwt[crypto]>=2.15.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "requests>=2.33",
    # 13.0.0 clears the pillow advisories open against 12.3.0.
    "Pillow>=13.0.0",
    "websockets>=14.0",
    # Pin transitive deps with known CVEs (see pip-audit output).
    # cryptography is pulled in via pyjwt[crypto]; 50.0.0 clears PYSEC-2026-3552.
    "cryptography>=50.0.0",
    # click pulled in via uvicorn/typer; 8.3.3 clears PYSEC-2026-2132.
    "click>=8.3.3",
    # idna pulled in via requests/httpx/anyio; 3.15 clears CVE-2026-45409.
    "idna>=3.15",
    # starlette pulled in via fastapi; 1.3.1 clears PYSEC-2026-248/249.
    "starlette>=1.3.1",
    # msgpack pulled in via cachecontrol; 1.2.3 clears GHSA-6v7p-g79w-8964 and CVE-2026-114613.
    "msgpack>=1.2.3",
    # anyio pulled in via httpx/starlette; 4.14.2 clears PYSEC-2026-4024/4025.
    "anyio>=4.14.2",
    # certifi pulled in via requests/httpx; 2026.10.18 clears PYSEC-2026-4320.
    "certifi>=2026.10.18",
    # urllib3 pulled in via requests/botocore; 2.8.0 clears the advisories open against 2.7.0.
    "urllib3>=2.8.0",
    # Concordia: interrupt-driven GameMaster framework used by the WorldGM service.
    # Latest stable is 2.4.0. The plan specified ^0.2.0 but the package is now 2.x.
    "gdm-concordia>=2.0.0,<3.0.0",
    # The goosetown CLI/daemon, imported as a library so the WorldGM service can
    # run resident agents in-process. 0.2.2 adds TownDaemon._on_pending_message_cb,
    # which ResidentManager wires to wake a resident's brain the instant a
    # conversation message arrives (event-driven replies; PR #350).
    "goosetown>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "moto[dynamodb]>=5.0",
    "boto3-stubs[dynamodb]>=1.35",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Pin transitive (rich → pygments) to clear CVE-2026-4539.
    "pygments>=2.20.0",
    # pip pulled in via pip-audit → pip-api; 26.2 clears the advisories open against 26.1.2.
    "pip>=26.2",
    # werkzeug pulled in via moto; 3.1.9 clears the advisories open against 3.1.6.
    "werkzeug>=3.1.9",
    # filelock pulled in via pip-audit → cachecontrol[filecache]; 4.2.1 clears CVE-2026-112907..112940.
    "filelock>=4.2.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"data/**" = ["E501"]

[tool.bandit]
# Skip B101 (assert_used) globally — asserts are the correct pattern in pytest.
# All other findings are either fixed inline or suppressed with # nosec <id>: <reason>.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
