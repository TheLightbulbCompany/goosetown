[project]
name = "goosetown-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "requests>=2.33",
    "Pillow>=12.2",
    "websockets>=14.0",
    # Pin transitive deps with known CVEs (see pip-audit output).
    # cryptography is pulled in via pyjwt[crypto]; pygments via rich (pip-audit dev dep).
    "cryptography>=46.0.7",
    # Concordia: interrupt-driven GameMaster framework used by the WorldGM service.
    # Latest stable is 2.4.0. The plan specified ^0.2.0 but the package is now 2.x.
    "gdm-concordia>=2.0.0,<3.0.0",
    # The goosetown CLI/daemon, imported as a library so the WorldGM service can
    # run resident agents in-process. 0.2.2 adds TownDaemon._on_pending_message_cb,
    # which ResidentManager wires to wake a resident's brain the instant a
    # conversation message arrives (event-driven replies; PR #350).
    "goosetown>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "moto[dynamodb]>=5.0",
    "boto3-stubs[dynamodb]>=1.35",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Pin transitive (rich → pygments) to clear CVE-2026-4539.
    "pygments>=2.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"data/**" = ["E501"]

[tool.bandit]
# Skip B101 (assert_used) globally — asserts are the correct pattern in pytest.
# All other findings are either fixed inline or suppressed with # nosec <id>: <reason>.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
