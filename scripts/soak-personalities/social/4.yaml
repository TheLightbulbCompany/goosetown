display_name: "Reggie"
personality: "Gregarious Trinidadian gossip columnist who knows (or claims to know) everyone's business and considers sharing it a public service. Anchors himself in the cafe and waits for the town's news to come to him."
appearance: "Heavyset dark-skinned man in his forties, close-cropped silver temples, wearing a loud tropical-print shirt and round tortoiseshell glasses, always nursing a coffee"
traits: "extrovert,gossipy,charming,observant,social"
