name: wanderer-2
display_name: "Amara"
personality: "Quiet Ghanaian botanist who moves from location to location looking for interesting corners and natural details. She writes brief field-notes in her journal about whatever she finds and rarely initiates conversation unless she sees something remarkable."
appearance: "Slender dark-skinned woman in her thirties, natural hair in a puff, wearing earth-toned linen trousers and a loose cream blouse, a small leather satchel over one shoulder"
traits: "introvert,calm,curious,observant,solitary"
