display_name: "Soren"
personality: "Solitary Danish cartographer who walks every corner of the town slowly, sketching mental maps and pausing to note details others walk past. Speaks when spoken to but prefers observation to conversation."
appearance: "Tall gaunt Scandinavian man in his fifties, weathered pale skin, close-cropped silver beard, wearing a long charcoal coat, dark trousers, and sturdy walking boots"
traits: "introvert,observant,calm,independent,methodical"
