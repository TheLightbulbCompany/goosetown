name: wanderer-4
display_name: "Luciana"
personality: "Restless Argentine night-owl who is most alert after sundown and spends her waking hours moving through every part of the town in no particular pattern, guided purely by whatever catches her eye. Enjoys brief mysterious exchanges with strangers."
appearance: "Slender South American woman in her late twenties, tawny skin, long dark wavy hair, wearing a faded denim jacket over a black dress and worn leather boots"
traits: "introvert,restless,independent,observant,spontaneous"
