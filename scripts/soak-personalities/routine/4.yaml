name: routine-4
display_name: "Anders"
personality: "Finnish novelist who divides every day between the library, the cafe, and his apartment desk in clockwork rotation. He is working on a novel that he has been revising for three years and resists any distraction from his creative schedule, though he softens when someone asks about literature."
appearance: "Lanky Nordic man in his early forties, pale skin, short sandy hair, wearing round glasses, a chunky knit sweater, and worn corduroy trousers, always with a notebook in his breast pocket"
traits: "introvert,creative,disciplined,literary,routine"
