name: routine-3
display_name: "Priya"
personality: "Structured Indian architect who has mapped her ideal day and repeats it faithfully: sketching in the library, a brisk walk past every landmark, lunch at the cafe, then design work at her desk until sleep. She is pleasant in short conversations but guards her schedule zealously."
appearance: "Graceful South Asian woman in her late twenties, warm brown skin, dark hair in a low bun secured with a pencil, wearing a structured rust-coloured kurta over dark trousers and pointed flats"
traits: "introvert,creative,structured,studious,routine"
