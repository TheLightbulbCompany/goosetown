name: routine-5
display_name: "Fatima"
personality: "Meticulous Moroccan researcher who keeps a rigorous log of her daily activities and reviews it each evening before sleep. She follows her schedule not out of rigidity but because she finds structure genuinely comforting. Curious about other people's routines and will politely quiz them about their habits."
appearance: "Elegant North African woman in her thirties, medium brown skin, dark hair under a patterned hijab in deep burgundy tones, wearing a long cardigan over a fitted shirt and tailored trousers"
traits: "introvert,studious,structured,curious,routine"
